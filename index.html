<!DOCTYPE html><html lang="ja"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>射出成形 サイクル・型締め冷却タイマー管理</title>  <script src="https://cdn.tailwindcss.com"></script>  <style>    @keyframes phase-flash {      0%, 100% { opacity: 1; }      50% { opacity: 0.5; }    }    .phase-active { animation: phase-flash 1s ease-in-out infinite; }    @keyframes spin-cw {      from { transform: rotate(0deg); }      to { transform: rotate(360deg); }    }    .spin-anim { animation: spin-cw 2s linear infinite; }  </style></head><body class="bg-slate-100 min-h-screen">  <div class="max-w-2xl mx-auto px-4 py-6">    <!-- Header -->    <header class="mb-6">      <h1 class="text-2xl font-bold text-slate-800">射出成形 サイクルタイマー</h1>      <p class="text-sm text-slate-500 mt-1">型締め・冷却フェーズ管理 &amp; 実績記録</p>    </header>    <!-- Tab Nav -->    <div class="flex gap-1 mb-6 bg-slate-200 p-1 rounded-xl" role="tablist" aria-label="メインタブ">      <button id="tab-run" role="tab" aria-selected="true" aria-controls="panel-run"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors bg-white text-slate-900 shadow"        onclick="switchTab('run')">サイクル実行</button>      <button id="tab-settings" role="tab" aria-selected="false" aria-controls="panel-settings"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-300"        onclick="switchTab('settings')">設定</button>      <button id="tab-stats" role="tab" aria-selected="false" aria-controls="panel-stats"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:bg-slate-300"        onclick="switchTab('stats')">統計</button>    </div>    <!-- Run Panel -->    <div id="panel-run" role="tabpanel" aria-labelledby="tab-run">      <!-- Phase Indicator -->      <div class="bg-white rounded-xl shadow p-4 mb-4">        <h2 class="text-sm font-medium text-slate-500 mb-3">フェーズ進行状況</h2>        <div id="phase-indicators" class="flex gap-1 flex-wrap justify-center" role="list" aria-label="成形フェーズ一覧">          <!-- Populated by JS -->        </div>      </div>      <!-- Main Timer -->      <div class="bg-white rounded-xl shadow p-6 mb-4 text-center">        <!-- Animated gear/mold icon -->        <div class="flex justify-center mb-3">          <svg id="cycle-icon" width="60" height="60" viewBox="0 0 60 60" aria-hidden="true">            <circle cx="30" cy="30" r="20" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 5"/>            <circle id="inner-circle" cx="30" cy="30" r="10" fill="#3b82f6" opacity="0.3"/>            <text x="30" y="35" text-anchor="middle" font-size="12" fill="#1e40af" id="phase-icon-text">⚙</text>          </svg>        </div>        <div id="phase-label" class="text-lg font-semibold text-slate-700 mb-1" aria-live="polite">-</div>        <div id="phase-timer" class="text-6xl font-mono font-bold text-blue-700 mb-2" aria-live="polite" aria-atomic="true">0.0s</div>        <div class="text-sm text-slate-500 mb-4">          <span>目標: </span><span id="phase-target" class="font-bold text-slate-700">-</span>          <span class="ml-4">残り: </span><span id="phases-remaining" class="font-bold text-slate-700" aria-live="polite">-</span>        </div>        <!-- Total cycle progress -->        <div class="mb-4">          <div class="flex justify-between text-xs text-slate-500 mb-1">            <span>サイクル進捗</span>            <span id="cycle-pct-label" aria-live="polite">0%</span>          </div>          <div class="w-full bg-gray-200 rounded-full h-3" role="progressbar"            aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="cycle-progress-bar-wrap">            <div id="cycle-progress-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width:0%"></div>          </div>        </div>        <!-- Controls -->        <div class="flex gap-3 justify-center">          <button id="btn-start-cycle" onclick="startCycle()"            class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">            開始          </button>          <button id="btn-stop-cycle" onclick="stopCycle()" disabled            class="px-6 py-3 bg-gray-400 text-white rounded-xl font-bold hover:bg-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-400 disabled:opacity-50 transition-colors">            中断          </button>        </div>      </div>      <!-- Last Cycle Result -->      <div id="last-result" class="bg-white rounded-xl shadow p-4 hidden" aria-live="polite">        <h2 class="text-sm font-bold text-slate-600 mb-2">直前サイクル結果</h2>        <div id="last-result-content" class="text-sm text-slate-700"></div>      </div>    </div>    <!-- Settings Panel -->    <div id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" class="hidden">      <div class="bg-white rounded-xl shadow p-4 mb-4">        <h2 class="font-bold text-slate-700 mb-4">フェーズ目標時間設定 (秒)</h2>        <div id="settings-fields" class="space-y-3">          <!-- Populated by JS -->        </div>        <button onclick="saveSettings()"          class="mt-4 w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors">          保存        </button>      </div>    </div>    <!-- Stats Panel -->    <div id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" class="hidden">      <div class="bg-white rounded-xl shadow p-4 mb-4">        <div class="flex justify-between items-center mb-4">          <h2 class="font-bold text-slate-700">サイクル統計</h2>          <button onclick="clearStats()"            class="text-xs text-red-500 hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-red-300 rounded px-2 py-1">            クリア          </button>        </div>        <!-- Summary cards -->        <div class="grid grid-cols-2 gap-3 mb-4">          <div class="bg-blue-50 rounded-lg p-3 text-center">            <div id="stat-count" class="text-2xl font-bold text-blue-700">0</div>            <div class="text-xs text-slate-500">総サイクル数</div>          </div>          <div class="bg-green-50 rounded-lg p-3 text-center">            <div id="stat-avg" class="text-2xl font-bold text-green-700">-</div>            <div class="text-xs text-slate-500">平均サイクル (秒)</div>          </div>          <div class="bg-yellow-50 rounded-lg p-3 text-center">            <div id="stat-min" class="text-2xl font-bold text-yellow-700">-</div>            <div class="text-xs text-slate-500">最短 (秒)</div>          </div>          <div class="bg-red-50 rounded-lg p-3 text-center">            <div id="stat-max" class="text-2xl font-bold text-red-700">-</div>            <div class="text-xs text-slate-500">最長 (秒)</div>          </div>        </div>        <!-- Efficiency -->        <div class="bg-slate-50 rounded-lg p-3 mb-4 text-center">          <div id="stat-efficiency" class="text-3xl font-bold text-slate-700">-</div>          <div class="text-xs text-slate-500">平均効率 % (実績/目標)</div>        </div>        <!-- History table -->        <div class="overflow-x-auto">          <table class="w-full text-xs" aria-label="サイクル履歴テーブル">            <thead>              <tr class="bg-slate-100">                <th class="p-2 text-left">#</th>                <th class="p-2 text-right">合計(秒)</th>                <th class="p-2 text-right">効率%</th>                <th class="p-2 text-left">完了時刻</th>              </tr>            </thead>            <tbody id="stats-table-body">              <tr><td colspan="4" class="text-center text-slate-400 p-4">データなし</td></tr>            </tbody>          </table>        </div>      </div>    </div>  </div>  <script>    function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }    // ===== Phase Definitions =====    const DEFAULT_PHASES = [      { key: 'injection',  label: '射出',   icon: '💉', color: 'bg-red-500',    target: 3 },      { key: 'hold',       label: '保圧',   icon: '🔒', color: 'bg-orange-500', target: 5 },      { key: 'cooling',    label: '冷却',   icon: '❄️', color: 'bg-blue-500',   target: 20 },      { key: 'mold-open',  label: '型開',   icon: '📂', color: 'bg-purple-500', target: 3 },      { key: 'ejection',   label: '取出',   icon: '📤', color: 'bg-green-500',  target: 4 },      { key: 'close',      label: '型締',   icon: '📁', color: 'bg-slate-500',  target: 3 },    ];    // ===== State =====    let phases = [];    let cycleState = {      running: false,      phaseIndex: 0,      phaseStartTime: 0,      cycleStartTime: 0,      intervalId: null,      actualPhaseTimes: [],    };    // ===== localStorage =====    function loadSettings() {      try { return JSON.parse(localStorage.getItem('moldtimerSettings') || 'null'); } catch { return null; }    }    function saveSettingsLS(ph) { localStorage.setItem('moldtimerSettings', JSON.stringify(ph)); }    function loadHistory() {      try { return JSON.parse(localStorage.getItem('moldtimerHistory') || '[]'); } catch { return []; }    }    function saveHistory(h) { localStorage.setItem('moldtimerHistory', JSON.stringify(h)); }    // ===== Tab =====    function switchTab(tab) {      ['run', 'settings', 'stats'].forEach(t => {        document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);        const btn = document.getElementById('tab-' + t);        btn.setAttribute('aria-selected', t === tab ? 'true' : 'false');        if (t === tab) {          btn.classList.add('bg-white', 'text-slate-900', 'shadow');          btn.classList.remove('text-slate-600', 'hover:bg-slate-300');        } else {          btn.classList.remove('bg-white', 'text-slate-900', 'shadow');          btn.classList.add('text-slate-600', 'hover:bg-slate-300');        }      });      if (tab === 'stats') renderStats();      if (tab === 'settings') renderSettingsFields();    }    // ===== Phase Indicators =====    function renderPhaseIndicators() {      const container = document.getElementById('phase-indicators');      container.innerHTML = '';  // xss-ok: reviewed-internal-data      phases.forEach((ph, idx) => {        const div = document.createElement('div');        div.id = 'phase-ind-' + idx;        div.role = 'listitem';        div.className = 'flex flex-col items-center px-2 py-2 rounded-lg transition-all min-w-[60px]';        div.innerHTML = `<span class="text-xl" aria-hidden="true">${ph.icon}</span>          <span class="text-xs font-medium text-slate-600 mt-0.5">${ph.label}</span>          <span class="text-xs text-slate-400">${ph.target}s</span>`; // xss-ok: internal constant        container.appendChild(div);      });    }    function updatePhaseIndicators(activeIdx) {      phases.forEach((_, idx) => {        const el = document.getElementById('phase-ind-' + idx);        if (!el) return;        el.classList.remove('bg-blue-100', 'ring-2', 'ring-blue-400', 'opacity-40');        if (idx === activeIdx) {          el.classList.add('bg-blue-100', 'ring-2', 'ring-blue-400');          el.classList.remove('opacity-40');        } else if (idx < activeIdx) {          el.classList.add('opacity-40');        }      });    }    // ===== Settings Fields =====    function renderSettingsFields() {      const container = document.getElementById('settings-fields');      container.innerHTML = '';  // xss-ok: reviewed-internal-data      phases.forEach((ph, idx) => {        const div = document.createElement('div');        div.className = 'flex items-center gap-3';        div.innerHTML = `          <span class="text-xl w-8 text-center" aria-hidden="true">${ph.icon}</span>          <label for="set-${ph.key}" class="w-20 text-sm text-slate-700">${ph.label}</label>          <input id="set-${ph.key}" type="number" value="${ph.target}" min="1" max="300" step="0.5"            aria-label="${ph.label} 目標時間（秒）"            class="w-24 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">          <span class="text-xs text-slate-400">秒</span>        `; // xss-ok: internal constant        container.appendChild(div);      });    }    function saveSettings() {      phases.forEach(ph => {        const val = parseFloat(document.getElementById('set-' + ph.key).value);        if (!isNaN(val) && val > 0) ph.target = val;      });      saveSettingsLS(phases);      renderPhaseIndicators();      switchTab('run');    }    // ===== Cycle Logic =====    function totalTargetSeconds() {      return phases.reduce((s, ph) => s + ph.target, 0);    }    function startCycle() {      if (cycleState.running) return;      cycleState.running = true;      cycleState.phaseIndex = 0;      cycleState.phaseStartTime = performance.now();      cycleState.cycleStartTime = performance.now();      cycleState.actualPhaseTimes = [];      document.getElementById('btn-start-cycle').disabled = true;      document.getElementById('btn-stop-cycle').disabled = false;      document.getElementById('cycle-icon').classList.add('spin-anim');      updatePhaseIndicators(0);      cycleState.intervalId = setInterval(cycleRender, 50);    }    function cycleRender() {      if (!cycleState.running) return;      const now = performance.now();      const phaseElapsed = (now - cycleState.phaseStartTime) / 1000;      const cycleElapsed = (now - cycleState.cycleStartTime) / 1000;      const ph = phases[cycleState.phaseIndex];      document.getElementById('phase-label').textContent = ph.icon + ' ' + ph.label;      document.getElementById('phase-timer').textContent = phaseElapsed.toFixed(1) + 's';      document.getElementById('phase-target').textContent = ph.target + 's';      document.getElementById('phases-remaining').textContent =        (phases.length - cycleState.phaseIndex) + ' フェーズ';      const totalTarget = totalTargetSeconds();      const pct = Math.min(100, Math.round((cycleElapsed / totalTarget) * 100));      document.getElementById('cycle-progress-bar').style.width = pct + '%';      document.getElementById('cycle-pct-label').textContent = pct + '%';      document.getElementById('cycle-progress-bar-wrap').setAttribute('aria-valuenow', pct);      // Auto-advance when phase target reached      if (phaseElapsed >= ph.target) {        cycleState.actualPhaseTimes.push(phaseElapsed);        cycleState.phaseIndex++;        if (cycleState.phaseIndex >= phases.length) {          completeCycle(cycleElapsed);          return;        }        cycleState.phaseStartTime = performance.now();        updatePhaseIndicators(cycleState.phaseIndex);      }    }    function completeCycle(totalSecs) {      clearInterval(cycleState.intervalId);      cycleState.running = false;      document.getElementById('btn-start-cycle').disabled = false;      document.getElementById('btn-stop-cycle').disabled = true;      document.getElementById('cycle-icon').classList.remove('spin-anim');      document.getElementById('phase-label').textContent = '✅ サイクル完了';      document.getElementById('phase-timer').textContent = totalSecs.toFixed(1) + 's';      document.getElementById('cycle-progress-bar').style.width = '100%';      document.getElementById('cycle-pct-label').textContent = '100%';      // Save record      const history = loadHistory();      const target = totalTargetSeconds();      const eff = Math.round((target / totalSecs) * 100);      const record = {        no: history.length + 1,        total: parseFloat(totalSecs.toFixed(1)),        target,        efficiency: eff,        phases: cycleState.actualPhaseTimes.map(t => parseFloat(t.toFixed(2))),        completedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),      };      history.push(record);      saveHistory(history);      // Show last result      showLastResult(record);    }    function stopCycle() {      clearInterval(cycleState.intervalId);      cycleState.running = false;      document.getElementById('btn-start-cycle').disabled = false;      document.getElementById('btn-stop-cycle').disabled = true;      document.getElementById('cycle-icon').classList.remove('spin-anim');      document.getElementById('phase-label').textContent = '中断';      updatePhaseIndicators(-1);    }    function showLastResult(record) {      const el = document.getElementById('last-result');      const content = document.getElementById('last-result-content');      el.classList.remove('hidden');      let html = `<div class="grid grid-cols-3 gap-2 mb-2">        <div class="text-center"><div class="font-bold text-blue-700">${record.total}s</div><div class="text-xs text-slate-500">実績</div></div>        <div class="text-center"><div class="font-bold text-slate-600">${record.target}s</div><div class="text-xs text-slate-500">目標</div></div>        <div class="text-center"><div class="font-bold ${record.efficiency >= 100 ? 'text-green-600' : record.efficiency >= 80 ? 'text-yellow-600' : 'text-red-600'}">${record.efficiency}%</div><div class="text-xs text-slate-500">効率</div></div>      </div>`;      html += `<div class="text-xs text-slate-500">フェーズ別: ` +        record.phases.map((t, i) => `${phases[i] ? phases[i].label : i+1}: ${t}s`).join(' / ') + '</div>';      content.innerHTML = html; // xss-ok: computed value    }    // ===== Stats =====    function renderStats() {      const history = loadHistory();      document.getElementById('stat-count').textContent = history.length;      if (history.length === 0) {        ['stat-avg','stat-min','stat-max','stat-efficiency'].forEach(id =>          document.getElementById(id).textContent = '-');        // xss-ok: reviewed-internal-data        document.getElementById('stats-table-body').innerHTML =          '<tr><td colspan="4" class="text-center text-slate-400 p-4">データなし</td></tr>'; // xss-ok: static string        return;      }      const totals = history.map(r => r.total);      const avg = totals.reduce((a,b)=>a+b,0) / totals.length;      document.getElementById('stat-avg').textContent = avg.toFixed(1);      document.getElementById('stat-min').textContent = Math.min(...totals).toFixed(1);      document.getElementById('stat-max').textContent = Math.max(...totals).toFixed(1);      const avgEff = history.reduce((a,r)=>a+r.efficiency,0) / history.length;      document.getElementById('stat-efficiency').textContent = avgEff.toFixed(0) + '%';      const tbody = document.getElementById('stats-table-body');      tbody.innerHTML = '';  // xss-ok: reviewed-internal-data      [...history].reverse().slice(0, 20).forEach(r => {        const tr = document.createElement('tr');        tr.className = 'border-t border-slate-100';        const effClass = r.efficiency >= 100 ? 'text-green-600' : r.efficiency >= 80 ? 'text-yellow-600' : 'text-red-600';        // xss-ok: reviewed-internal-data        tr.innerHTML = `<td class="p-2">${r.no}</td>          <td class="p-2 text-right">${r.total}</td>          <td class="p-2 text-right font-bold ${effClass}">${r.efficiency}%</td>          <td class="p-2 text-left text-slate-500">${r.completedAt}</td>`; // xss-ok: computed value        tbody.appendChild(tr);      });    }    function clearStats() {      if (!confirm('統計データを全て削除しますか？')) return;      saveHistory([]);      renderStats();    }    // ===== Init =====    function init() {      const saved = loadSettings();      if (saved && Array.isArray(saved) && saved.length === DEFAULT_PHASES.length) {        phases = saved;      } else {        phases = DEFAULT_PHASES.map(p => ({ ...p }));      }      renderPhaseIndicators();      renderSettingsFields();      // Show idle state      document.getElementById('phase-label').textContent = '待機中';      document.getElementById('phase-timer').textContent = '-';      document.getElementById('phase-target').textContent =        totalTargetSeconds().toFixed(1) + 's (目標合計)';      document.getElementById('phases-remaining').textContent = phases.length + ' フェーズ';    }    init();  </script></body></html>
